name: Update Shenyang Recruitment Calendar

on:
  schedule:
    - cron: '15 0 * * *'
    - cron: '15 11 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build calendar
        run: python3 scripts/build_calendar.py

      - name: Commit calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recruitment.ics
          if ! git diff --cached --quiet; then
            git commit -m "Update recruitment calendar"
            git push
          fi
